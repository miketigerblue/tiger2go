# ----------------------------------------------------------------------
# Per-source ingestors
# ----------------------------------------------------------------------

[nvd]
enabled       = true
poll_interval = "1h"
page_size     = 2000
# api_key comes from NVD_API_KEY env

[epss]
enabled       = true
poll_interval = "24h"
url           = "https://api.first.org/data/v1/epss"
page_size     = 5000

[kev]
enabled       = true
poll_interval = "24h"
url           = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

[osv]
enabled       = true
poll_interval = "24h"
ecosystems = [
  "PyPI",
  "npm",
  "Go",
  "Maven",
  "RubyGems",
  "crates.io",
  "Packagist",
  "NuGet",
  "Pub",
  "Hex",
  "Hackage",
]

[ghsa]
enabled       = true
poll_interval = "1h"
page_size     = 100
# token comes from GHSA_TOKEN env

[nuclei]
enabled       = true
poll_interval = "24h"

[msf]
enabled       = true
poll_interval = "24h"

[abusech]
# api_key comes from ABUSECH_API_KEY env (shared across the three sub-runners)

[abusech.urlhaus]
enabled       = true
poll_interval = "1h"

[abusech.threatfox]
enabled       = true
poll_interval = "1h"
# Hourly poll with days=1 (~24h lookback) gives full coverage of fresh
# IOCs without the multi-MB days=7 response that has been triggering
# RST_STREAM(INTERNAL_ERROR) from abuse.ch's h2 edge mid-body.
days          = 1

[abusech.malwarebazaar]
enabled       = true
poll_interval = "1h"
selector      = "time"

[alerting]
enabled       = true
poll_interval = "1h"
lookback_days = 7
# webhooks configured via separate mechanism — leave empty for now
