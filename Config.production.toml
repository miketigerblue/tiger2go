# ----------------------------------------------------------------------
# tigerfetch — production Config.toml
#
# Structure-only config baked into the runtime image (see Dockerfile).
# NO SECRETS HERE — credentials come from Fly secrets via env vars:
#
#   DATABASE_URL      → database_url
#   NVD_API_KEY       → nvd.api_key
#   GHSA_TOKEN        → ghsa.token
#   ABUSECH_API_KEY   → abusech.api_key
#
# viper precedence (Env > File > Default) means the env values
# override anything here. Keep this file env-overrideable; do not
# inline real credentials.
#
# Dev/local config: Config.toml (gitignored + .dockerignored, so the
# committed Config.toml.example is the dev reference instead).
# ----------------------------------------------------------------------

# database_url comes from DATABASE_URL env (set via fly secrets)
ingest_interval = "1h"
server_bind     = "0.0.0.0:9101"


