name: Security & Quality Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Quality Assurance (Linting & Formatting)
  # -----------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'gofmt -w .'"
            exit 1
          fi

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # -----------------------------------------------------------------------------
  # Job 2: Security Scans (SAST & SCA)
  # -----------------------------------------------------------------------------
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    # security-events lets gosec findings reach the Security tab rather than
    # dying in the job log when nobody is watching.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # govulncheck-action sets Go up again internally and restores the
          # same module cache, and the second extraction lands on files the
          # first already wrote — 11 "Cannot open: File exists" failure
          # annotations per run, non-fatal but they make every green run look
          # broken. Only one of the two can own the cache; this job is short,
          # so let the nested one have it.
          cache: false

      # 1. Dependency Analysis (SCA) - Go Native
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

      # 2. Static Analysis (SAST)
      # No -no-fail: findings still break the build, as before. The SARIF is a
      # record, not a substitute for the gate.
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec.sarif ./...'

      # always(): gosec exits non-zero when it finds something, which is exactly
      # when the findings are worth publishing.
      - name: Upload Gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec
        # Fork PRs cannot write to Code Scanning; that must not fail the run.
        continue-on-error: true

  # -----------------------------------------------------------------------------
  # Job 3: Secret Scanning
  # -----------------------------------------------------------------------------
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the API on pull_request events;
    # workflow-level contents:read alone 403s (learned on tiger-watch #1).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret is only interesting if it is in the log,
          # and a shallow clone hides exactly that.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------------------
  # Job 4: Unit & Integration Testing
  # -----------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      # Service container for tests requiring DB
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tiger2go_test
        ports:
          - 5432:5432
        # Simple health check to wait for DB readiness
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run Tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/tiger2go_test?sslmode=disable
        run: go test -v -race -cover -p 1 ./...

  # -----------------------------------------------------------------------------
  # Job 5: Container Security (Trivy)
  # -----------------------------------------------------------------------------
  container-security:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [quality, security, secrets, test] # Only build if code is good
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker Image
        run: docker build -t tiger2go:${{ github.sha }} .

      # Two Trivy passes over one image, deliberately. This one is the gate:
      # table output, non-zero exit, breaks the build.
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tiger2go:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # This one is the record: same findings as SARIF, exit-code 0 so it
      # always produces a file even when the gate above has already failed.
      - name: Trivy SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tiger2go:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
        continue-on-error: true

      - name: Generate SBOM (SPDX-JSON)
        # SPDX-JSON format so tiger-watch's /sbom/upload parser accepts it
        # directly. Uploaded as the `sbom` artifact for downstream ingest.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tiger2go:${{ github.sha }}'
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Publish SBOM to tiger-watch
        # Main-branch pushes only: PR builds (incl. forks) must not write
        # to the lake. Auth: X-API-Key checked against tiger-watch's
        # SBOM_UPLOAD_API_KEY fly secret.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -sf --retry 3 --retry-delay 5 -X POST \
            "${TIGER_WATCH_URL}/sbom/upload" \
            -H "X-API-Key: ${TIGER_WATCH_API_KEY}" \
            -F "file=@sbom.spdx.json" \
            -F "vendor=tigerblue" \
            -F "device_type=container:tiger2go" \
            -F "notes=CI ${GITHUB_SHA} run ${GITHUB_RUN_ID}"
        env:
          TIGER_WATCH_URL: ${{ vars.TIGER_WATCH_URL || 'https://tiger-watch.fly.dev' }}
          TIGER_WATCH_API_KEY: ${{ secrets.TIGER_WATCH_API_KEY }}
